[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skinlib"
# Package version. NOT the same thing as PREPROCESSING_VERSION in
# skinlib/version.py, which stamps metric comparability. Bumping one does not
# imply bumping the other.
version = "0.1.0"
description = "Deterministic facial skin measurement: image in, structured metrics out."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "mediapipe>=0.10",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-xdist>=3.5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
skinlib-evaluate = "tools.evaluate:main"
skinlib-repeatability = "tools.repeatability:main"
skinlib-tone-audit = "tools.tone_audit:main"

[tool.hatch.build.targets.wheel]
packages = ["skinlib"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
# Deliberately not enabling import sorting as an error: this package orders
# some imports for circularity reasons that a sorter would silently undo.
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
# The numeric core passes arrays through cv2 and scipy, neither of which ships
# useful stubs. Typing the library's own surface is the point; chasing those is
# not.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "needs_weights: requires the BiSeNet checkpoint (see README)",
    "needs_landmarker: requires the MediaPipe face_landmarker.task asset (see README)",
]

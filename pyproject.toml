[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skinlib"
# Package version. NOT the same thing as PREPROCESSING_VERSION in
# skinlib/version.py, which stamps metric comparability. Bumping one does not
# imply bumping the other.
version = "0.1.0"
description = "Deterministic facial skin measurement: image in, structured metrics out."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "mediapipe>=0.10",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["skinlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "needs_weights: requires the BiSeNet checkpoint (see README)",
    "needs_landmarker: requires the MediaPipe face_landmarker.task asset (see README)",
]
